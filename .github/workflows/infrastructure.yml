name: Provision Azure infrastructure

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed Terraform plan
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    #environment: production
    env:
      ARM_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_TENANT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}
      ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_name_suffix: ${{ vars.TF_NAME_SUFFIX }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login with Service Principal
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Terraform init
        run: >-
          terraform -chdir=infra init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=code-to-cloud.tfstate"
          -backend-config="use_azuread_auth=true"

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Terraform plan
        run: terraform -chdir=infra plan -out=tfplan -input=false

      - name: Terraform apply
        if: ${{ inputs.apply }}
        run: terraform -chdir=infra apply -input=false -auto-approve tfplan

      - name: Deployment outputs
        if: ${{ inputs.apply }}
        run: terraform -chdir=infra output
